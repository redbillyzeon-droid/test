<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>戦闘画面モック</title>
<style>
  /* 仮の素材だけで作った配置確認用のモック。最終的な絵は別に用意する */
  body { margin: 0; background: #000; }
  #screen {
    position: relative; width: 1280px; height: 720px; overflow: hidden;
    font-family: "Noto Serif CJK JP", "Noto Serif JP", serif; color: #2b241c;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(190,60,90,.55), transparent 55%),
      radial-gradient(ellipse at 20% 40%, rgba(120,30,70,.6), transparent 50%),
      linear-gradient(#2a0d1f, #12060f 70%, #080306);
  }
  /* 地面 */
  #ground { position: absolute; left: 0; right: 0; bottom: 0; height: 260px;
    background: linear-gradient(transparent, rgba(40,20,30,.9)); }
  /* 敵の名前とマス */
  #enemyBar { position: absolute; left: 20px; top: 18px; display: flex; align-items: center;
    background: #e9e2d2; border: 3px solid #1a1410; padding: 4px 10px; gap: 10px; }
  #enemyBar .name { background: #1a1410; color: #e9e2d2; padding: 4px 18px; font-weight: bold; letter-spacing: .1em; }
  #enemyBar .cell { width: 22px; height: 22px; background: #6b2a2a; border: 2px solid #1a1410; }
  #enemyBar .cell.empty { background: #4a4a4a; }
  /* 絆ゲージ */
  #bond { position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
    background: #c98a2b; border: 3px solid #3a2410; padding: 6px 14px; text-align: center; color: #2a1608; }
  #bond .label { font-size: 12px; letter-spacing: .3em; background: #3a2410; color: #f3d9a4; padding: 2px 8px; }
  #bond .gems { margin-top: 6px; font-size: 26px; letter-spacing: 6px; }
  /* 右上のアイコン */
  #icons { position: absolute; right: 20px; top: 18px; display: flex; gap: 10px; }
  #icons div { width: 48px; height: 48px; background: #ddd6c6; border: 3px solid #1a1410;
    display: flex; align-items: center; justify-content: center; font-size: 12px; }
  /* コマンドメニュー */
  #menu { position: absolute; left: 110px; top: 150px; width: 220px; background: rgba(240,235,222,.95);
    border: 2px solid #1a1410; box-shadow: 0 0 30px rgba(255,255,255,.35); padding: 10px 0; }
  #menu .item { display: flex; align-items: center; gap: 14px; padding: 9px 18px; font-size: 22px;
    border-bottom: 1px solid #bdb4a2; letter-spacing: .3em; }
  #menu .item .ico { width: 26px; height: 26px; background: #3d3a35; border-radius: 3px; }
  #menu .item.sel { background: linear-gradient(90deg, #f0a52a, #e8b04a); font-weight: bold; margin: 0 -10px; padding-left: 28px; }
  /* 敵 */
  .enemy { position: absolute; bottom: 230px; display: flex; flex-direction: column; align-items: center; }
  .enemy .body { border-radius: 45% 45% 30% 30%;
    background: radial-gradient(circle at 50% 30%, #4b4a5c, #15141c 70%); box-shadow: 0 0 40px rgba(200,80,120,.5); }
  .enemy .tag { margin-top: 6px; color: #f3d9a4; font-size: 16px; letter-spacing: .2em; text-shadow: 0 0 6px #000; }
  #gm .body { width: 200px; height: 360px; background: radial-gradient(circle at 50% 25%, #e8e4dc 0 18%, #2a2733 19%, #0e0d12 75%); }
  .phantom .body { width: 150px; height: 230px; opacity: .75; }
  /* 味方のカード */
  #party { position: absolute; left: 20px; bottom: 18px; display: flex; gap: 22px; }
  .card { position: relative; width: 190px; height: 190px; }
  .card .photo { position: absolute; left: 0; top: 10px; width: 110px; height: 160px; background: #f4f0e6;
    border: 6px solid #f4f0e6; box-shadow: 2px 3px 8px rgba(0,0,0,.6); transform: rotate(-2deg); }
  .card .photo .face { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #f4f0e6; }
  .card .stats { position: absolute; left: 96px; top: 40px; width: 92px; }
  .card .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .card .k { background: #c9772a; color: #fff; font-size: 12px; padding: 1px 4px; font-family: sans-serif; }
  .card .v { color: #f4f0e6; font-size: 22px; font-weight: bold; font-family: sans-serif; text-shadow: 0 0 4px #000; }
  .card .bar { height: 6px; background: #3a3a3a; margin-top: -2px; margin-bottom: 8px; }
  .card .bar i { display: block; height: 100%; background: #4fbf5a; }
  .card .bar.mind i { background: #6a8ee8; }
  .card .name { position: absolute; left: 6px; top: 150px; color: #f4f0e6; font-size: 14px; text-shadow: 0 0 4px #000; }
  #note { position: absolute; right: 20px; bottom: 14px; color: rgba(255,255,255,.55); font-size: 12px; font-family: sans-serif; }
</style>
</head>
<body>
<div id="screen">
  <div id="ground"></div>

  <div id="enemyBar">
    <span class="name">黒瀬カイ</span>
    <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
    <span class="cell"></span><span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span>
  </div>

  <div id="bond">
    <div class="label">絆ゲージ</div>
    <div class="gems">◆◆◆◇◇</div>
  </div>

  <div id="icons"><div>ログ</div><div>道具</div><div>設定</div></div>

  <div id="menu">
    <div class="item"><span class="ico"></span>攻撃</div>
    <div class="item"><span class="ico"></span>守る</div>
    <div class="item sel"><span class="ico"></span>技</div>
    <div class="item"><span class="ico"></span>道具</div>
    <div class="item"><span class="ico"></span>言葉</div>
    <div class="item"><span class="ico"></span>絆</div>
  </div>

  <div class="enemy phantom" style="left:470px"><div class="body"></div><div class="tag">幻影</div></div>
  <div class="enemy" id="gm" style="left:660px"><div class="body"></div><div class="tag">ゲームマスター</div></div>
  <div class="enemy phantom" style="left:900px"><div class="body"></div><div class="tag">幻影</div></div>

  <div id="party">
    <div class="card">
      <div class="photo"><div class="face" style="background:#4a5568">ユ</div></div>
      <div class="stats">
        <div class="row"><span class="k">HP</span><span class="v">836</span></div><div class="bar"><i style="width:80%"></i></div>
        <div class="row"><span class="k">心</span><span class="v">124</span></div><div class="bar mind"><i style="width:60%"></i></div>
      </div>
      <div class="name">ユウ</div>
    </div>
    <div class="card">
      <div class="photo"><div class="face" style="background:#d9822b">コ</div></div>
      <div class="stats">
        <div class="row"><span class="k">HP</span><span class="v">969</span></div><div class="bar"><i style="width:95%"></i></div>
        <div class="row"><span class="k">心</span><span class="v">118</span></div><div class="bar mind"><i style="width:55%"></i></div>
      </div>
      <div class="name">コノハ（相棒）</div>
    </div>
  </div>

  <div id="note">配置確認用モック（仮の図形のみ。絵は別途用意）</div>
</div>
</body>
</html>
